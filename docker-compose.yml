services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: vetdom
      POSTGRES_PASSWORD: vetdom
      POSTGRES_DB: vetdom
    ports:
      - "5432:5432"
    volumes:
      - vetdom_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vetdom"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      DATABASE_URL: postgresql+psycopg://vetdom:vetdom@db:5432/vetdom
      CORS_ORIGINS: "*"
      JWT_SECRET: dev-secret-troque-em-producao
      JWT_EXPIRA_HORAS: "8"
      ADMIN_NOME: Administrador
      ADMIN_EMAIL: admin@vetdom.local
      ADMIN_SENHA: vetdom123
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app
      - ./backend/alembic:/app/alembic

  frontend:
    image: node:20-alpine
    restart: unless-stopped
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    environment:
      VITE_BACKEND_URL: http://backend:8000
    depends_on:
      - backend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - vetdom_frontend_node_modules:/app/node_modules

volumes:
  vetdom_pgdata:
  vetdom_frontend_node_modules:
