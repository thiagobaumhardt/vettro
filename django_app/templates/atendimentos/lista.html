{% extends "base.html" %}
{% block title %}Atendimentos — Vettro{% endblock %}
{% block content %}
<div class="card">
  <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; gap:10px; flex-wrap:wrap;">
    <h2 style="margin:0;">Atendimentos</h2>
    <div style="display:flex; gap:10px;">
      <a href="{% url 'atendimentos:vacinas' %}" class="btn-secondary btn">Vacinas</a>
      <a href="{% url 'atendimentos:novo' %}" class="btn-primary btn">+ Novo Atendimento</a>
    </div>
  </div>

  <form id="filtros-atendimentos" hx-get="{% url 'atendimentos:lista' %}" hx-target="#atendimentos-grid"
        hx-swap="outerHTML" hx-push-url="true" hx-trigger="input changed delay:300ms from:input[type=search], change"
        class="form-grid" style="grid-template-columns:repeat(auto-fit, minmax(160px, 1fr)); margin-bottom:16px;">
    <div style="grid-column:span 2;"><label>Buscar</label>
      <input type="search" name="q" value="{{ filtros.q }}" placeholder="Nº, paciente, tutor ou vacina...">
    </div>
    <div><label>Tipo</label>
      <select name="tipo">
        <option value="">Todos</option>
        {% for valor, rotulo in tipos %}<option value="{{ valor }}" {% if filtros.tipo == valor %}selected{% endif %}>{{ rotulo }}</option>{% endfor %}
      </select>
    </div>
    <div><label>Espécie</label>
      <select name="especie">
        <option value="">Todas</option>
        {% for valor, rotulo in especies %}<option value="{{ valor }}" {% if filtros.especie == valor %}selected{% endif %}>{{ rotulo }}</option>{% endfor %}
      </select>
    </div>
    <div><label>De</label><input type="date" name="de" value="{{ filtros.de }}"></div>
    <div><label>Até</label><input type="date" name="ate" value="{{ filtros.ate }}"></div>
    <div style="display:flex; align-items:flex-end; gap:8px;">
      <label style="display:flex; align-items:center; gap:6px; margin:0;">
        <input type="checkbox" name="plantao" value="1" {% if filtros.plantao == "1" %}checked{% endif %}> Só plantão
      </label>
    </div>
    <div style="display:flex; align-items:flex-end;">
      <a href="{% url 'atendimentos:lista' %}" class="btn-secondary btn">Limpar filtros</a>
    </div>
  </form>

  {% include "atendimentos/_grid.html" %}
</div>
{% endblock %}
