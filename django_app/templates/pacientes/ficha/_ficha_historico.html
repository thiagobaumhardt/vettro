<div x-data="{ filtro: '' }">
  <div style="display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:14px;">
    <div class="section-title" style="margin:0;">Histórico de atendimentos <span style="color:var(--muted); font-weight:normal;">({{ linha_do_tempo|length }})</span></div>
    {% if "atendimentos" in secoes_permitidas %}<a href="{% url 'atendimentos:novo' %}" class="btn-primary btn">+ Novo atendimento</a>{% endif %}
  </div>
  {% if categorias|length > 1 %}
  <div style="display:flex; gap:6px; flex-wrap:wrap; margin-bottom:14px;">
    <button type="button" class="btn" :class="filtro === '' ? 'btn-primary' : 'btn-secondary'" @click="filtro = ''">Todos</button>
    {% for valor, rotulo in categorias %}
    <button type="button" class="btn" :class="filtro === '{{ valor }}' ? 'btn-primary' : 'btn-secondary'" @click="filtro = '{{ valor }}'">{{ rotulo }}</button>
    {% endfor %}
  </div>
  {% endif %}
  {% include "pacientes/ficha/_linha_do_tempo.html" with com_filtro=True %}
</div>
