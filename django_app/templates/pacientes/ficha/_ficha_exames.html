<form hx-post="{% url 'pacientes:exame_upload' paciente.pk %}" hx-target="#ficha-conteudo" hx-encoding="multipart/form-data" style="margin-bottom:16px;">
  {% csrf_token %}
  <label class="btn-secondary btn upload-label" style="cursor:pointer; border:1.5px dashed var(--border-2);">
    📎 Anexar exame(s) (PDF, até 5MB cada)
    <input type="file" name="arquivos" accept="application/pdf" multiple style="display:none;" onchange="this.form.requestSubmit()">
  </label>
</form>

{% if exames %}
<div class="pdf-list">
  {% for e in exames %}
  <div class="card" style="box-shadow:none; border:1px solid var(--border); display:flex; justify-content:space-between; align-items:center; padding:12px 16px;">
    <span>📄 {{ e.nome }} <small style="color:var(--muted);">({{ e.tamanho_mb }})</small></span>
    <span style="display:flex; gap:10px;">
      <a href="{{ e.arquivo.url }}" target="_blank" class="btn-secondary btn">Abrir</a>
      <button class="btn-danger btn" data-confirm="Excluir este exame?"
              hx-post="{% url 'pacientes:exame_excluir' paciente.pk e.pk %}" hx-target="#ficha-conteudo">Excluir</button>
    </span>
  </div>
  {% endfor %}
</div>
{% else %}
<div class="empty"><span class="icon">📄</span>Nenhum exame anexado ainda.</div>
{% endif %}
