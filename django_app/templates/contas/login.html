{% extends "base_public.html" %}
{% block title %}Entrar — Vettro{% endblock %}
{% block content %}
<div class="login-wrap">
  <div class="login-card">
    <h1>🐾 Vettro</h1>
    <p class="subtitle">Atendimento veterinário a domicílio</p>

    {% if erro %}<div class="login-error">{{ erro }}</div>{% endif %}

    <form method="post">
      {% csrf_token %}
      {% if request.GET.next %}<input type="hidden" name="next" value="{{ request.GET.next }}">{% endif %}
      <label for="email">E-mail</label>
      <input type="email" id="email" name="email" required autofocus style="margin-bottom:12px;">
      <label for="senha">Senha</label>
      <input type="password" id="senha" name="senha" required style="margin-bottom:18px;">
      <button type="submit" class="btn-primary btn" style="width:100%; justify-content:center;">Entrar</button>
    </form>
  </div>
</div>
{% endblock %}
