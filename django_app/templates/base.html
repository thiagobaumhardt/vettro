{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Vettro{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Livvic:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'dist/styles.css' %}">
  <script src="{% static 'vendor/htmx.min.js' %}" defer></script>
  <script src="{% static 'vendor/alpine.min.js' %}" defer></script>
</head>
<body>
  <div class="app-shell" x-data="{ sidebarAberta: false }">
    <div class="sidebar-backdrop" :class="{ aberta: sidebarAberta }" @click="sidebarAberta = false"></div>
    {% include "partials/_sidebar.html" %}
    <div style="flex:1; display:flex; flex-direction:column; min-width:0;">
      {% include "partials/_topbar.html" %}
      <main class="app-content">
        {% block content %}{% endblock %}
      </main>
    </div>
  </div>

  {% include "components/_toast.html" %}
  {% include "components/_confirm_modal.html" %}
</body>
</html>
