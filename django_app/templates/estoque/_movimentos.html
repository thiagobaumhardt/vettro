<div class="table-wrap">
  <table>
    <thead><tr><th>Quando</th><th>Tipo</th><th>Qtd</th><th>Origem</th><th>Obs</th></tr></thead>
    <tbody>
      {% for m in movimentos %}
      <tr>
        <td>{{ m.criado_em|date:"d/m/Y H:i" }}</td>
        <td>{{ m.get_tipo_display }} · {{ m.get_subtipo_display }}</td>
        <td>{{ m.quantidade }}</td>
        <td>{{ m.nota_fiscal_numero|default:"—" }}</td>
        <td>{{ m.observacao|default:"—" }}</td>
      </tr>
      {% empty %}
      <tr><td colspan="5" class="empty">Nenhuma movimentação ainda.</td></tr>
      {% endfor %}
    </tbody>
  </table>
</div>
